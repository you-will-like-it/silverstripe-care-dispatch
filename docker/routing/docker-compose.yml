# Self-hosted routing for route optimisation (no location data leaves your infrastructure).
#
# 1. Prepare map data once (and after OSM updates):   ./prepare.sh
# 2. Start:                                             docker compose up -d
# 3. Silverstripe .env:
#      CARE_DISPATCH_OSRM_URL="http://osrm:5000"
#      CARE_DISPATCH_VROOM_URL="http://vroom:3000"
#
# VROOM receives our own duration matrix, so it does not need to talk to OSRM itself.
services:
  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v6.0.0
    command: osrm-routed --algorithm mld --max-table-size 1000 /data/region.osrm
    volumes:
      - ./data:/data:ro
    ports:
      - "127.0.0.1:5000:5000"
    restart: unless-stopped

  vroom:
    image: ghcr.io/vroom-project/vroom-docker:v1.14.0
    environment:
      VROOM_ROUTER: osrm
    volumes:
      - ./vroom-conf:/conf
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - osrm
    restart: unless-stopped
